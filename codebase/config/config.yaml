# ============================================================
# AI Failure Root Cause Prediction - Configuration
# ============================================================

project:
  name: "ai-failure-root-cause"
  version: "1.0.0"

paths:
  data_dir: "data"
  artifacts_dir: "artifacts"
  raw_data: "data/failures.csv"
  embeddings: "artifacts/embeddings.npy"
  classifier: "artifacts/classifier.joblib"
  metadata: "artifacts/metadata.csv"
  faiss_index: "artifacts/faiss.index"
  label_encoder: "artifacts/label_encoder.joblib"

data:
  n_samples: 3000
  random_seed: 42
  test_size: 0.2

categories:
  - NullPointer
  - Configuration
  - Dependency
  - ResourceExhaustion
  - RaceCondition
  - Auth
  - Validation
  - Network
  - Database

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"   # fast & strong
  # Alternatives: "all-mpnet-base-v2", "BAAI/bge-base-en-v1.5", "BAAI/bge-large-en-v1.5"
  batch_size: 64
  device: "cuda"          # "cuda" or "cpu"
  normalize: true

classifier:
  type: "logistic"        # "logistic" | "random_forest"
  max_iter: 1000
  class_weight: "balanced"
  n_estimators: 200       # only for random_forest
  random_state: 42

similarity:
  top_k: 5
  metric: "cosine"

preprocessing:
  max_text_length: 2000
  remove_request_ids: true
  remove_hex: true
  remove_timestamps: true
  extract_key_phrases: true
  spacy_model: "en_core_web_sm"

gradio:
  title: "AI Software Failure Root Cause Predictor"
  description: "Paste a stacktrace / error message and get the predicted root cause + similar historical cases."
  share: false
